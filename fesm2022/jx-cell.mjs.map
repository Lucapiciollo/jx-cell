<div class="jx-cell jx-cell-text" (dblclick)="startEdit()">
  <ng-container *ngIf="!editing">
    {{ context.value }}
  </ng-container>

  <input
    *ngIf="editing"
    class="jx-cell-editor"
    [(ngModel)]="editValue"
    (blur)="commit()"
    (keydown.enter)="commit()"
    (keydown.escape)="cancel()"
    autofocus
  />
</div>
